
name: Keep Marg.ai AI Service Awake

on:
  schedule:
    # Run every 10 minutes
    - cron: "*/10 * * * *"

  # Allow manual execution
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Marg.ai AI Service
        run: |
          curl --fail --show-error --silent \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            "https://marg-ai-ai-service.onrender.com/health"

      - name: Confirm
        run: echo "Marg.ai AI service health check completed."
